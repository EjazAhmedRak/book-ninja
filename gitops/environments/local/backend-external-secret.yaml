apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: backend-runtime
  namespace: book-ninja
spec:
  controller: book-ninja-local
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-secrets-reader
            key: access-key-id
          secretAccessKeySecretRef:
            name: floci-secrets-reader
            key: secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-runtime
  namespace: book-ninja
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: backend-runtime
    kind: SecretStore
  target:
    name: backend-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  # Explicit properties fail closed if a required application key is missing.
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: book-ninja/local/backend
        property: OPENAI_API_KEY
    - secretKey: TAVILY_API_KEY
      remoteRef:
        key: book-ninja/local/backend
        property: TAVILY_API_KEY
    - secretKey: HARDCOVER_API_KEY
      remoteRef:
        key: book-ninja/local/backend
        property: HARDCOVER_API_KEY
    - secretKey: MONGO_URI
      remoteRef:
        key: book-ninja/local/backend
        property: MONGO_URI
    - secretKey: LANGSMITH_API_KEY
      remoteRef:
        key: book-ninja/local/backend
        property: LANGSMITH_API_KEY
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: book-ninja/local/backend
        property: GOOGLE_CLIENT_ID
