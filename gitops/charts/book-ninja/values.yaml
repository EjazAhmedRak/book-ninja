replicaCount: 2
image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent
runtimeSecret: backend-runtime
config:
  APP_ENV: prod
  FRONTEND_ORIGINS: ""
  LANGCHAIN_PROJECT: book-ninja
  LANGCHAIN_TRACING_V2: "true"
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  minAvailable: 1
