{{- if .Values.targetGroupBinding.enabled }}
{{- $target := required "Set targetGroupBinding.targetGroupARN when enabling the binding" .Values.targetGroupBinding.targetGroupARN -}}
{{- $vpc := required "Set targetGroupBinding.vpcID when enabling the binding" .Values.targetGroupBinding.vpcID -}}
{{- if not (regexMatch "^arn:aws[a-z-]*:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/[^/]+/[a-z0-9]+$" $target) -}}
{{- fail "targetGroupBinding.targetGroupARN must be a target-group ARN" -}}
{{- end -}}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: {{ .Release.Name }}-backend
spec:
  targetGroupARN: {{ $target | quote }}
  targetType: ip
  vpcID: {{ $vpc | quote }}
  serviceRef:
    name: {{ .Release.Name }}-backend
    port: 8000
{{- end }}
