name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
      - 'infra/scripts/**'
      - 'infra/tests/**'
      - 'gitops/charts/book-ninja/**'
      - 'gitops/argocd/**'
      - 'gitops/platform/argocd/**'
      - 'gitops/platform/load-balancer-controller/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
      - 'infra/scripts/**'
      - 'infra/tests/**'
      - 'gitops/charts/book-ninja/**'
      - 'gitops/argocd/**'
      - 'gitops/platform/argocd/**'
      - 'gitops/platform/load-balancer-controller/**'
      - 'gitops/environments/local/backend-values.yaml'

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: apps/backend
        run: ruff check src

      - name: Test + Coverage
        working-directory: apps/backend
        env:
          OPENAI_API_KEY: test-key
          TAVILY_API_KEY: test-key
          HARDCOVER_API_KEY: test-key
          MONGO_URI: mongodb://localhost:27017/book_ninja_test
          LANGSMITH_API_KEY: test-key
          GOOGLE_CLIENT_ID: test-client-id
          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_PROJECT: book-ninja-test
        run: pytest --cov=src --cov-fail-under=60

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t book-ninja-backend:${{ github.sha }} apps/backend

  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provisioning helper tests
        run: python3 -m unittest discover -s infra/tests -p 'test_*.py' -v
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.3.2
      - name: Validate local workload chart
        run: |
          helm lint gitops/charts/book-ninja \
            -f gitops/environments/local/backend-values.yaml \
            --set-string config.FRONTEND_ORIGINS=http://localhost:5173
          helm template book-ninja gitops/charts/book-ninja -n book-ninja \
            -f gitops/environments/local/backend-values.yaml \
            --set-string config.FRONTEND_ORIGINS=http://localhost:5173 > /tmp/backend-rendered.yaml
      - name: Validate pinned Argo CD bootstrap chart
        run: |
          bash -n gitops/platform/argocd/install-local.sh
          helm repo add argo https://argoproj.github.io/argo-helm
          helm template argocd argo/argo-cd --version 10.18.1 -n argocd \
            -f gitops/platform/argocd/local-values.yaml > /tmp/argocd-rendered.yaml
      - name: Validate target binding and pinned load balancer controller
        run: |
          bash -n gitops/platform/load-balancer-controller/install-local.sh
          helm repo add eks https://aws.github.io/eks-charts
          helm template aws-load-balancer-controller eks/aws-load-balancer-controller \
            --version 3.6.3 -n load-balancer-system \
            -f gitops/platform/load-balancer-controller/local-values.yaml \
            --set-string vpcId=vpc-01234567 > /tmp/load-balancer-controller-rendered.yaml
          helm template book-ninja gitops/charts/book-ninja -n book-ninja \
            -f gitops/environments/local/backend-values.yaml \
            --set-string config.FRONTEND_ORIGINS=http://localhost:5173 \
            --set targetGroupBinding.enabled=true \
            --set-string targetGroupBinding.vpcID=vpc-01234567 \
            --set-string targetGroupBinding.targetGroupARN=arn:aws:elasticloadbalancing:us-east-1:000000000000:targetgroup/test/0123456789abcdef \
            > /tmp/backend-with-target-binding.yaml
